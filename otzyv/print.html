<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Табличка «Оцените нас» для печати — кофейня «Песок» (демо)</title>
<meta name="description" content="Табличка с QR-кодом для стойки: гости оценивают визит за 5 секунд.">
<link rel="stylesheet" href="../koleso/fonts/fonts.css">
<style>
@page{size:A6;margin:0}
*{box-sizing:border-box}
body{margin:0;background:#ddd;font-family:Onest,system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;gap:14px;padding:20px}
.bar{font-size:14px}.bar button{font:600 15px Onest,sans-serif;padding:10px 18px;border-radius:12px;border:0;background:#1b0f07;color:#fff;cursor:pointer}
.sheet{width:105mm;height:148mm;background:linear-gradient(180deg,#fff4e6,#ffe1c2);color:#1b0f07;padding:10mm 9mm;display:flex;flex-direction:column;align-items:center;text-align:center;box-shadow:0 10px 30px #0003}
.logo{font-family:"Dela Gothic One";font-size:20pt}.logo span{color:#ff6a1a}
h1{font-family:"Dela Gothic One";font-weight:400;font-size:21pt;line-height:1.05;margin:6mm 0 3mm}
.st{font-size:20pt;letter-spacing:3pt;color:#ff8a3d;margin:0 0 4mm}
img{width:58mm;height:58mm;border-radius:4mm;background:#fff;padding:2mm}
p{font-size:10pt;margin:4mm 0 0;line-height:1.35}
.small{margin-top:auto;font-size:7.5pt;opacity:.6}
@media print{body{background:none;padding:0}.bar{display:none}.sheet{box-shadow:none}}
</style>
</head>
<body>
<div class="bar"><button onclick="print()">Распечатать (А6)</button> &nbsp; <a href="./">← к странице оценки</a></div>
<div class="sheet">
  <div class="logo">Песок<span>.</span></div>
  <h1>Как вам у нас сегодня?</h1>
  <div class="st">★★★★★</div>
  <img src="qr.svg" alt="QR-код на страницу оценки">
  <p>Наведите камеру телефона на код —<br>это займёт 5 секунд. Спасибо! ☕</p>
  <div class="small">Демо-табличка. «Песок» — концепт кофейни.</div>
</div>
</body>
</html>
