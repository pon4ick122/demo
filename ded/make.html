<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Собрать письмо</title>
<meta name="robots" content="noindex">
<style>
:root{--bg:#0f1626;--card:#18223a;--ink:#eef2fb;--muted:#9aa8c4;--red:#d8473f;--line:#ffffff1f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,sans-serif;padding:20px 16px}
main{max-width:560px;margin:0 auto}
h1{font-size:24px;margin:0 0 4px}.sub{color:var(--muted);margin:0 0 20px}
label{display:block;font-size:14px;color:var(--muted);margin:14px 0 6px}
input,textarea,select{width:100%;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
textarea{min-height:96px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
button{font:700 16px system-ui;border:0;border-radius:12px;padding:14px 18px;cursor:pointer;background:var(--red);color:#fff;margin-top:18px}
#out{margin-top:16px;word-break:break-all;background:var(--card);border:1px dashed var(--line);border-radius:12px;padding:12px;font-size:13px;display:none}
.btns{display:flex;gap:10px;flex-wrap:wrap}.btns a,.btns button{flex:1;text-align:center}
.btns a{display:block;text-decoration:none;font-weight:700;border-radius:12px;padding:14px;margin-top:18px;background:#2b3a5e;color:#fff}
</style>
</head>
<body>
<main>
  <h1>Письмо от Деда Мороза</h1>
  <p class="sub">Заполни по ответам родителя и отправь ему ссылку. Данные хранятся только в самой ссылке.</p>
  <div class="row">
    <div><label>Имя ребёнка</label><input id="n" placeholder="Маша"></div>
    <div><label>Кому (на конверте)</label><input id="dat" placeholder="Маше"></div>
  </div>
  <div class="row">
    <div><label>Пол</label><select id="g"><option value="f">девочка</option><option value="m">мальчик</option></select></div>
    <div><label>Возраст</label><input id="a" type="number" min="1" max="14" placeholder="6"></div>
  </div>
  <label>Город (необязательно)</label><input id="c" placeholder="Москва">
  <label>Чем молодец в этом году: по одному в строке, после «ты…»</label>
  <textarea id="d" placeholder="помогала маме накрывать на стол&#10;научилась читать по слогам&#10;делилась игрушками в садике"></textarea>
  <label>Какой подарок просил(а)</label><input id="w" placeholder="кукольный домик">
  <label>Просьба от Деда Мороза (после «Одна просьба от меня:»)</label><input id="p" placeholder="слушайся родителей и не забывай чистить зубы">
  <div class="btns"><button id="go">Собрать ссылку</button><a id="view" href="#" target="_blank" rel="noopener">Открыть</a></div>
  <div id="out"></div>
</main>
<script>
const $ = id => document.getElementById(id);
function build() {
  const o = { n: $("n").value.trim() || "Маша", dat: $("dat").value.trim(), g: $("g").value, a: +$("a").value || 0,
    c: $("c").value.trim(), d: $("d").value.split("\n").map(s => s.trim()).filter(Boolean), w: $("w").value.trim(),
    p: $("p").value.trim(), y: new Date().getMonth() >= 9 ? new Date().getFullYear() + 1 : new Date().getFullYear() };
  if (!o.dat) o.dat = o.n;
  const b64 = btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  return new URL("./#" + b64, location.href).href;
}
$("go").onclick = () => { const u = build(); $("out").style.display = "block"; $("out").textContent = u; $("view").href = u;
  navigator.clipboard && navigator.clipboard.writeText(u).then(() => { $("go").textContent = "Скопировано ✓"; setTimeout(() => $("go").textContent = "Собрать ссылку", 1500); }).catch(() => {}); };
$("view").onclick = () => { $("view").href = build(); };
</script>
</body>
</html>
