<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Письмо от Деда Мороза</title>
<meta name="description" content="Тебе пришло письмо из Великого Устюга!">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Marck+Script&family=Lora:ital,wght@0,500;0,700;1,500&family=Onest:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#081428;--ink:#3a2412;--paper:#fbf3e2;--paper2:#f1e1bf;--red:#c8302a;--gold:#e9b949;--snow:#fff}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);overflow-x:hidden}
body{min-height:100svh;font-family:Lora,Georgia,serif;color:var(--ink);background:radial-gradient(120% 80% at 50% 0%,#173a6b 0,var(--bg) 65%)}
#snow{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.scene{position:relative;z-index:1;min-height:100svh;display:grid;place-items:center;padding:24px 16px}
/* конверт */
.env{width:min(420px,92vw);aspect-ratio:1.5/1;position:relative;cursor:pointer;border:0;padding:0;background:none}
.env .body{position:absolute;inset:0;border-radius:14px;background:linear-gradient(160deg,#d8473f,#9e1f1a);box-shadow:0 30px 70px #000a}
.env .flap{position:absolute;left:0;right:0;top:0;height:62%;clip-path:polygon(0 0,100% 0,50% 100%);background:linear-gradient(180deg,#e85a51,#b52a24);transform-origin:50% 0;z-index:2}
.env .seal{position:absolute;left:50%;top:50%;width:76px;height:76px;margin:-38px 0 0 -38px;border-radius:50%;z-index:3;
  background:radial-gradient(circle at 35% 30%,#ffe08a,#d39b23 70%);display:grid;place-items:center;font-size:36px;box-shadow:0 6px 14px #0006}
.env .to{position:absolute;left:0;right:0;bottom:12%;text-align:center;color:#ffe9c7;font-family:"Marck Script";font-size:clamp(22px,5vw,30px);z-index:1}
.hint{color:#cfe0ff;font-family:Onest,sans-serif;font-size:15px;text-align:center;margin-top:22px;opacity:.85;animation:bob 1.8s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
/* письмо */
.letter{display:none;width:min(680px,100%);background:linear-gradient(180deg,var(--paper),var(--paper2));border-radius:6px;padding:clamp(26px,6vw,56px);
  box-shadow:0 40px 90px #000b;position:relative;margin:30px 0}
.letter::before{content:"";position:absolute;inset:10px;border:2px solid #c8302a33;border-radius:4px;pointer-events:none}
.from{font-family:Onest,sans-serif;font-size:12px;letter-spacing:3px;text-transform:uppercase;color:var(--red);text-align:center}
.letter h1{font-family:"Marck Script";font-weight:400;font-size:clamp(38px,8vw,60px);text-align:center;margin:8px 0 18px;color:var(--red);line-height:1.05}
.letter p{font-size:clamp(17px,2.4vw,20px);line-height:1.65;margin:0 0 14px}
.letter ul{margin:4px 0 18px;padding-left:0;list-style:none}
.letter li{font-size:clamp(17px,2.4vw,20px);line-height:1.5;margin:6px 0;padding-left:34px;position:relative}
.letter li::before{content:"⭐";position:absolute;left:0}
.sign{display:flex;justify-content:space-between;align-items:flex-end;margin-top:26px;gap:16px}
.sign .name{font-family:"Marck Script";font-size:clamp(30px,6vw,42px);color:#1c3d78;transform:rotate(-4deg)}
.stamp{width:110px;height:110px;border-radius:50%;border:3px solid #c8302acc;color:#c8302a;display:grid;place-items:center;text-align:center;
  font-family:Onest,sans-serif;font-weight:700;font-size:10px;letter-spacing:1px;transform:rotate(12deg);padding:12px;flex:none;opacity:.85}
.list{margin-top:26px;border-top:1px dashed #3a241255;padding-top:20px;text-align:center}
.list .k{font-family:Onest,sans-serif;font-size:12px;letter-spacing:2px;text-transform:uppercase;color:#7a5a3a}
.list .v{font-family:"Marck Script";font-size:34px;color:#1c7a45;margin:6px 0 0}
.again{display:block;margin:22px auto 0;font:700 15px Onest,sans-serif;background:var(--red);color:#fff;border:0;border-radius:12px;padding:12px 20px;cursor:pointer}
.w{opacity:0}
@media (prefers-reduced-motion:reduce){.hint{animation:none}}
</style>
</head>
<body>
<canvas id="snow" aria-hidden="true"></canvas>
<main class="scene">
  <div id="envWrap">
    <button class="env" id="env" aria-label="Открыть письмо">
      <div class="body"></div><div class="flap"></div><div class="seal">❄️</div>
      <div class="to" id="to">Маше</div>
    </button>
    <div class="hint">Нажми на печать, чтобы открыть</div>
  </div>
  <article class="letter" id="letter" aria-live="polite">
    <div class="from">Великий Устюг · Резиденция Деда Мороза</div>
    <h1 id="hi">Здравствуй, Маша!</h1>
    <div id="txt"></div>
    <div class="sign"><div class="name">Дед Мороз</div><div class="stamp">ПОЧТА<br>ДЕДА<br>МОРОЗА<br>❄ <span id="yr">2027</span> ❄</div></div>
    <div class="list"><div class="k">Список хороших детей</div><div class="v" id="ok">Маша — есть! ✓</div></div>
    <button class="again" id="again">Прочитать ещё раз</button>
  </article>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js" integrity="sha384-d+vyQ0dYcymoP8ndq2hW7FGC50nqGdXUEgoOUGxbbkAJwZqL7h+jKN0GGgn9hFDS" crossorigin="anonymous"></script>
<script>
"use strict";
/* Данные приходят из ссылки после # (на сервер не отправляются). Без данных — демо. */
const DEMO = { n: "Маша", dat: "Маше", g: "f", a: 6, c: "Москва",
  d: ["помогала маме накрывать на стол", "научилась читать по слогам", "делилась игрушками в садике"],
  w: "кукольный домик", p: "слушайся родителей и не забывай чистить зубы", y: 2027 };
let D = DEMO;
try {
  const h = location.hash.slice(1);
  if (h) D = Object.assign({}, DEMO, JSON.parse(decodeURIComponent(escape(atob(h.replace(/-/g, "+").replace(/_/g, "/"))))));
} catch (e) { D = DEMO; }

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const g = (m, f) => D.g === "f" ? f : m;
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const hasGsap = typeof gsap !== "undefined";

document.title = `${D.dat || D.n} — письмо от Деда Мороза`;
$("to").textContent = D.dat || D.n;
$("hi").textContent = `Здравствуй, ${D.n}!`;
$("ok").textContent = `${D.n} — есть! ✓`;
$("yr").textContent = D.y;

const parts = [];
parts.push(`<p>Пишу тебе из Великого Устюга. Здесь сейчас столько снега, что мои олени катаются с горки прямо до почты! Твоё письмо я получил и прочитал два раза.</p>`);
parts.push(`<p>${D.a ? `Тебе уже ${esc(D.a)} ${plural(D.a)}, и в этом` : "В этом"} году мои помощники-снеговики глаз с тебя не сводили${D.c ? ` — даже в городе ${esc(D.c)} они всё видят` : ""}. И вот что они мне рассказали:</p>`);
if (D.d && D.d.length) parts.push(`<ul>${D.d.filter(Boolean).map(x => `<li>ты ${esc(x)}</li>`).join("")}</ul>`);
parts.push(`<p>Я очень тобой горжусь! ${g("Ты вёл себя", "Ты вела себя")} как настоящий ${g("молодец", "умница")}, поэтому я записал тебя в Список хороших детей.</p>`);
if (D.w) parts.push(`<p>Ты ${g("просил", "просила")} у меня <b>${esc(D.w)}</b>. Мои мастера уже трудятся в мастерской, а Снегурочка лично проверит, чтобы подарок был красиво упакован. Загляни под ёлку в новогоднюю ночь!</p>`);
if (D.p) parts.push(`<p>Одна просьба от меня: ${esc(D.p)}. Договорились?</p>`);
parts.push(`<p>С наступающим Новым годом! Обнимаю тебя крепко-крепко.</p>`);
function plural(n) { n = +n; const a = n % 10, b = n % 100; return a === 1 && b !== 11 ? "год" : a >= 2 && a <= 4 && (b < 10 || b >= 20) ? "года" : "лет"; }
$("txt").innerHTML = parts.join("");

function revealWords() {
  const ps = $("txt").querySelectorAll("p, li");
  ps.forEach(p => { p.innerHTML = p.innerHTML.replace(/(^|>)([^<]+)(?=<|$)/g, (m, a, t) => a + t.split(/(\s+)/).map(w => w.trim() ? `<span class="w">${w}</span>` : w).join("")); });
  const ws = $("letter").querySelectorAll(".w");
  if (!hasGsap || reduce) { ws.forEach(w => w.style.opacity = 1); return; }
  gsap.to(ws, { opacity: 1, duration: .35, stagger: .045, ease: "power1.out" });
}

$("env").onclick = () => {
  const show = () => { $("envWrap").style.display = "none"; $("letter").style.display = "block";
    if (hasGsap && !reduce) gsap.from("#letter", { y: 120, scale: .85, rotate: -3, opacity: 0, duration: 1, ease: "expo.out" });
    revealWords(); burst(); };
  if (!hasGsap || reduce) return show();
  gsap.timeline({ onComplete: show })
    .to(".seal", { scale: 1.3, duration: .2 }).to(".seal", { scale: 0, opacity: 0, duration: .25 })
    .to(".flap", { rotateX: 180, duration: .6, ease: "power2.inOut" }, "<")
    .to("#env", { y: 60, opacity: 0, duration: .45, ease: "power2.in" });
};
$("again").onclick = () => { $("txt").innerHTML = parts.join(""); revealWords(); scrollTo({ top: 0, behavior: "smooth" }); };

/* снег */
const sc = $("snow"), sx = sc.getContext("2d"); let W, H, F = [], boost = 0;
function rs() { const r = devicePixelRatio || 1; W = sc.width = innerWidth * r; H = sc.height = innerHeight * r;
  F = Array.from({ length: Math.min(200, innerWidth / 5) }, () => ({ x: Math.random() * W, y: Math.random() * H, r: (Math.random() * 2.4 + .6) * r, s: Math.random() * .7 + .3, d: Math.random() * 6 })); }
rs(); addEventListener("resize", rs);
function burst() { boost = 1; }
(function loop(t) { sx.clearRect(0, 0, W, H); sx.fillStyle = "#ffffffc0"; boost *= .985;
  for (const f of F) { f.y += f.s * (1 + boost * 5) * (devicePixelRatio || 1); f.x += Math.sin(t / 1500 + f.d) * .4;
    if (f.y > H) { f.y = -5; f.x = Math.random() * W; } sx.beginPath(); sx.arc(f.x, f.y, f.r, 0, 7); sx.fill(); }
  if (!reduce) requestAnimationFrame(loop); })(0);
</script>
</body>
</html>
